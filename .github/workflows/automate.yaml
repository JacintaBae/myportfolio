
name: Automate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  automate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Run automate script
        run: npm run automate